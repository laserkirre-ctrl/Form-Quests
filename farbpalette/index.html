<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PnP · Farbpaletten-Planer</title>
<style>
:root{
  --ui-bg:#14141c; --ui-panel:#1c1c28; --ui-line:#33334a; --ui-text:#e8e8f2; --ui-muted:#8d8da8; --ui-acc:#6ee7ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:360px 1fr;grid-template-rows:auto auto 1fr;height:100vh}
header{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ui-line);background:var(--ui-panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.04em}
header .sp{flex:1}
.btn{background:#262636;border:1px solid var(--ui-line);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--ui-acc)}
.btn.on{background:var(--ui-acc);color:#000;border-color:var(--ui-acc)}
.btn.danger:hover{border-color:#ff5c7a;color:#ff5c7a}
#banner{grid-column:1/-1;display:none;gap:10px;align-items:center;padding:8px 16px;background:#33290d;border-bottom:1px solid #8a6d1a}
#banner.show{display:flex}
.vbar{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ui-line);overflow-x:auto}
.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--ui-line);border-radius:999px;background:#202030;white-space:nowrap}
.chip.active{border-color:var(--ui-acc);box-shadow:0 0 0 1px var(--ui-acc) inset}
.chip .sw{display:flex;border-radius:4px;overflow:hidden;border:1px solid #0006}
.chip .sw i{width:10px;height:14px;display:block}
.chip kbd{font-size:11px;color:var(--ui-muted)}
aside{overflow:auto;padding:14px 16px;border-right:1px solid var(--ui-line);background:var(--ui-panel)}
aside h3{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ui-muted)}
aside h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:44px 1fr 92px;gap:8px;align-items:center;margin:4px 0}
.row label{font-size:13px}
.row input[type=color]{width:44px;height:30px;padding:0;border:1px solid var(--ui-line);border-radius:6px;background:none;cursor:pointer}
.row input[type=text]{width:92px;background:#12121a;border:1px solid var(--ui-line);color:var(--ui-text);border-radius:6px;padding:4px 6px;font-family:ui-monospace,monospace;font-size:12px}
.row .lbl{display:flex;flex-direction:column;line-height:1.2}
.row .lbl small{color:var(--ui-muted);font-size:11px}
.slider{display:grid;grid-template-columns:1fr 40px;gap:8px;align-items:center}
.contrast{margin-top:6px;font-size:12px}
.contrast div{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed #2c2c40}
.ok{color:#5be584}.bad{color:#ff6b86}
main{overflow:auto;padding:18px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.grid.single{grid-template-columns:minmax(0,900px)}
.pvwrap{position:relative;border-radius:12px;outline:2px solid transparent}
.pvwrap.active{outline-color:var(--ui-acc)}
.pvtitle{position:absolute;top:-10px;left:12px;z-index:2;background:var(--ui-acc);color:#000;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pvwrap:not(.active) .pvtitle{background:#3a3a52;color:var(--ui-text)}

/* ========== PREVIEW (cyberpunk) – alles über Variablen ========== */
.pv{
  background:var(--bg);color:var(--text);border-radius:12px;padding:18px;
  font-family:"Rajdhani","Orbitron",ui-monospace,Consolas,monospace;
  position:relative;overflow:hidden;
  background-image:
    linear-gradient(transparent 95%,color-mix(in srgb,var(--border) 45%,transparent) 96%),
    linear-gradient(90deg,transparent 95%,color-mix(in srgb,var(--border) 45%,transparent) 96%);
  background-size:28px 28px;
}
.pv *{box-sizing:border-box}
.pv .nav{display:flex;align-items:center;gap:14px;padding:8px 12px;border:1px solid var(--border);background:var(--panel);margin-bottom:14px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));}
.pv .logo{font-weight:800;letter-spacing:.18em;color:var(--accent);text-shadow:0 0 calc(var(--glow)*.14px) var(--accent)}
.pv .nav a{color:var(--link);text-decoration:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.pv .nav a:hover{text-decoration:underline}
.pv .nav .sp{flex:1}
.pv h2{margin:0 0 4px;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--text);text-shadow:0 0 calc(var(--glow)*.12px) var(--accent2)}
.pv h2 span{color:var(--accent2)}
.pv p{margin:0 0 10px;color:var(--muted);font-size:14px}
.pv .card{background:var(--panel);border:1px solid var(--border);padding:14px;margin-bottom:14px;position:relative;
  box-shadow:0 0 calc(var(--glow)*.2px) color-mix(in srgb,var(--accent) 35%,transparent);
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);}
.pv .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.pv .meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pv .tag{font-size:11px;padding:1px 8px;border:1px solid var(--accent2);color:var(--accent2);text-transform:uppercase;letter-spacing:.1em}
.pv .tag.b{border-color:var(--accent);color:var(--accent)}
.pv .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pv button{font-family:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;cursor:pointer;
  background:var(--btnBg);color:var(--btnText);border:1px solid var(--btnBorder);
  box-shadow:0 0 calc(var(--glow)*.16px) var(--btnBorder), inset 0 0 calc(var(--glow)*.08px) var(--btnBorder);
  clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));}
.pv button:hover{filter:brightness(1.25)}
.pv button.ghost{background:transparent;color:var(--text);border-color:var(--border);box-shadow:none}
.pv button.sec{background:transparent;color:var(--accent2);border-color:var(--accent2);box-shadow:0 0 calc(var(--glow)*.12px) var(--accent2)}
.pv button.dis{opacity:.4;cursor:not-allowed}
.pv .alerts{display:grid;gap:8px;margin-bottom:14px}
.pv .al{padding:8px 12px;border:1px solid;border-left-width:4px;font-size:13px;background:color-mix(in srgb,var(--c) 12%,var(--panel));border-color:var(--c);color:var(--text)}
.pv .al b{color:var(--c);text-transform:uppercase;letter-spacing:.1em;margin-right:6px}
.pv .al.info{--c:var(--info)}.pv .al.ok{--c:var(--success)}.pv .al.warn{--c:var(--warn)}.pv .al.err{--c:var(--danger)}
.pv .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pv label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.pv input[type=text]{width:100%;background:color-mix(in srgb,var(--bg) 70%,#000);border:1px solid var(--border);color:var(--text);padding:7px 10px;font-family:inherit;font-size:14px;outline:none}
.pv input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 calc(var(--glow)*.12px) var(--accent)}
.pv .bar{height:10px;background:color-mix(in srgb,var(--bg) 70%,#000);border:1px solid var(--border);margin-top:6px}
.pv .bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 calc(var(--glow)*.16px) var(--accent)}
.pv .stat{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding:3px 0;font-size:13px}
.pv .stat b{color:var(--accent)}
.pv .stat.m span{color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--ui-line)}.grid{grid-template-columns:1fr}.pv .two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>◢ PnP · FARBPALETTEN-PLANER</h1>
    <span class="sp"></span>
    <button class="btn" id="bShare" title="Link mit allen Varianten in die Zwischenablage">🔗 Teilen-Link kopieren</button>
    <button class="btn" id="bExport">⬇ JSON</button>
    <button class="btn" id="bImport">⬆ JSON</button>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </header>

  <div id="banner">
    <span id="bannerTxt"></span>
    <button class="btn" id="bnAdd">Hinzufügen</button>
    <button class="btn" id="bnRep">Ersetzen</button>
    <button class="btn" id="bnIgn">Ignorieren</button>
  </div>

  <div class="vbar" id="vbar"></div>

  <aside id="side"></aside>

  <main>
    <div class="grid" id="grid"></div>
  </main>
</div>

<template id="tpl">
  <div class="pv">
    <div class="nav"><span class="logo">NEON//PnP</span><a>Kampagne</a><a>Charaktere</a><a>Quests</a><span class="sp"></span><a>Profil</a></div>
    <div class="card">
      <h2>Quest: <span>Schwarzmarkt</span> Nacht</h2>
      <p>Der Kontakt wartet im Sektor 7. Kein Scanner, keine Waffen – nur Kredits und ein falsches Lächeln.</p>
      <div class="meta"><span class="tag b">Level 3</span><span class="tag">Gefahr: Hoch</span><span class="tag b">Belohnung 1.200 ¢</span></div>
      <div class="bar"><i></i></div>
      <div class="btns">
        <button>Annehmen</button>
        <button class="sec">Verhandeln</button>
        <button class="ghost">Ablehnen</button>
        <button class="dis">Gesperrt</button>
      </div>
    </div>
    <div class="alerts">
      <div class="al info"><b>Hinweis</b>Neuer Eintrag im Logbuch verfügbar.</div>
      <div class="al ok"><b>Erfolg</b>Quest „Datenraub“ abgeschlossen.</div>
      <div class="al warn"><b>Warnung</b>Rüstung unter 20 % – Reparatur nötig.</div>
      <div class="al err"><b>Fehler</b>Verbindung zum Netzwerk verloren.</div>
    </div>
    <div class="two">
      <div class="card">
        <label>Charaktername</label>
        <input type="text" value="Kira „Glitch“ Voss">
        <div style="height:8px"></div>
        <label>Klasse</label>
        <input type="text" value="Netrunner">
      </div>
      <div class="card">
        <div class="stat"><span>Stärke</span><b>7</b></div>
        <div class="stat"><span>Reflexe</span><b>12</b></div>
        <div class="stat m"><span>Zuletzt gespielt</span><span>gestern, 22:14</span></div>
        <div class="stat m"><span>Sitzung</span><span>#14</span></div>
      </div>
    </div>
  </div>
</template>

<script>
const FIELDS = [
  ["Flächen", [
    ["bg","Hintergrund","Seiten-Hintergrund"],
    ["panel","Karte / Panel","Karten, Navigation"],
    ["border","Rahmen allgemein","Karten, Eingabefelder"],
  ]],
  ["Schrift", [
    ["text","Schriftfarbe","Haupttext"],
    ["muted","Schrift gedämpft","Beschreibung, Labels"],
    ["link","Link","Navigation, Links"],
  ]],
  ["Akzente", [
    ["accent","Akzent 1","Logo, Balken, Fokus"],
    ["accent2","Akzent 2","Überschrift, Tags"],
  ]],
  ["Buttons", [
    ["btnBg","Button Hintergrund",""],
    ["btnText","Button Schrift",""],
    ["btnBorder","Button Rahmen / Glow",""],
  ]],
  ["Meldungen", [
    ["info","Hinweis","Info"],
    ["success","Erfolg",""],
    ["warn","Warnung",""],
    ["danger","Fehler / Gefahr",""],
  ]],
];
const KEYS = FIELDS.flatMap(g=>g[1].map(f=>f[0]));
const LABEL = Object.fromEntries(FIELDS.flatMap(g=>g[1].map(f=>[f[0],f[1]])));

const BASE = {bg:"#0a0a12",panel:"#12121f",border:"#2a2a45",text:"#e6f1ff",muted:"#7a869a",link:"#ff9ef5",
  accent:"#00f0ff",accent2:"#ff2a6d",btnBg:"#101826",btnText:"#00f0ff",btnBorder:"#00f0ff",
  info:"#05d9e8",success:"#39ff14",warn:"#f9f002",danger:"#ff2a6d",glow:60};
const mk=(name,o)=>({id:Math.random().toString(36).slice(2,9),name,c:{...BASE,...o}});
const DEFAULTS=()=>[
  mk("A · Neon Cyan/Pink",{}),
  mk("B · Toxic Grün/Violett",{bg:"#07100a",panel:"#0e1a12",border:"#24402c",text:"#e8ffe9",muted:"#7fa588",link:"#c58bff",accent:"#39ff14",accent2:"#b026ff",btnBg:"#0c1f12",btnText:"#39ff14",btnBorder:"#39ff14",info:"#4de2ff",success:"#39ff14",warn:"#ffd60a",danger:"#ff3b5c",glow:70}),
  mk("C · Gedämpft Amber",{bg:"#14110d",panel:"#1d1913",border:"#3d3426",text:"#f3e9d7",muted:"#9a8c74",link:"#ffb86b",accent:"#ffb000",accent2:"#e4572e",btnBg:"#241d12",btnText:"#ffb000",btnBorder:"#ffb000",info:"#6ec6d9",success:"#8fd16a",warn:"#ffd166",danger:"#e4572e",glow:25}),
];

let S; // {variants:[], active:id, prev:id, mode:"single"|"all"}
const LS="pnp-farbpalette-v1";
function load(){
  try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.variants&&j.variants.length){S=j;return}}catch(e){}
  const v=DEFAULTS();S={variants:v,active:v[0].id,prev:v[1].id,mode:"single"};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const cur=()=>S.variants.find(v=>v.id===S.active)||S.variants[0];

/* ---------- Farb-Helfer ---------- */
const hexOk=h=>/^#[0-9a-f]{6}$/i.test(h);
function lum(h){const [r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*r+.7152*g+.0722*b}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}

/* ---------- Vorschau ---------- */
function applyVars(el,c){
  for(const k of KEYS)el.style.setProperty("--"+k,c[k]);
  el.style.setProperty("--glow",c.glow);
}
function mkPreview(v){
  const w=document.createElement("div");w.className="pvwrap"+(v.id===S.active?" active":"");
  w.innerHTML='<div class="pvtitle"></div>';w.firstChild.textContent=v.name;
  const pv=document.getElementById("tpl").content.firstElementChild.cloneNode(true);
  applyVars(pv,v.c);w.appendChild(pv);
  w.addEventListener("click",()=>{if(S.mode==="all")activate(v.id)});
  return w;
}
function renderMain(){
  const g=document.getElementById("grid");g.innerHTML="";
  g.className="grid"+(S.mode==="single"?" single":"");
  const list=S.mode==="all"?S.variants:[cur()];
  list.forEach(v=>g.appendChild(mkPreview(v)));
}
function livePreview(){ // nur Variablen aktualisieren
  const v=cur();
  document.querySelectorAll(".pvwrap").forEach((w,i)=>{
    const list=S.mode==="all"?S.variants:[v];
    if(list[i]&&list[i].id===v.id)applyVars(w.querySelector(".pv"),v.c);
  });
}

/* ---------- Varianten-Leiste ---------- */
function renderBar(){
  const b=document.getElementById("vbar");b.innerHTML="";
  S.variants.forEach((v,i)=>{
    const c=document.createElement("div");c.className="chip"+(v.id===S.active?" active":"");
    c.innerHTML='<span class="sw"></span><span class="nm"></span><kbd></kbd>';
    ["bg","accent","accent2","text"].forEach(k=>{const s=document.createElement("i");s.style.background=v.c[k];c.querySelector(".sw").appendChild(s)});
    c.querySelector(".nm").textContent=v.name;
    c.querySelector("kbd").textContent=i<9?(i+1):"";
    c.onclick=()=>activate(v.id);
    c.ondblclick=()=>rename(v.id);
    b.appendChild(c);
  });
  const add=(t,fn,cls="")=>{const x=document.createElement("button");x.className="btn "+cls;x.textContent=t;x.onclick=fn;b.appendChild(x);return x};
  const sp=document.createElement("span");sp.style.flex="1";b.appendChild(sp);
  add("＋ Kopie",()=>dup());
  add("✎ Umbenennen",()=>rename(S.active));
  add("🗑 Löschen",()=>del(),"danger");
  add("⇄ Vorherige (Leertaste)",()=>swap());
  add(S.mode==="all"?"▣ Einzelansicht":"▦ Alle nebeneinander",()=>{S.mode=S.mode==="all"?"single":"all";save();renderAll()},S.mode==="all"?"on":"");
}
function activate(id){if(id===S.active)return;S.prev=S.active;S.active=id;save();renderAll()}
function swap(){if(S.variants.some(v=>v.id===S.prev)&&S.prev!==S.active)activate(S.prev)}
function dup(){const v=cur();const n={id:Math.random().toString(36).slice(2,9),name:v.name.replace(/ \(Kopie\)$/,"")+" (Kopie)",c:{...v.c}};S.variants.splice(S.variants.indexOf(v)+1,0,n);S.prev=S.active;S.active=n.id;save();renderAll()}
function rename(id){const v=S.variants.find(x=>x.id===id);const n=prompt("Name der Variante:",v.name);if(n&&n.trim()){v.name=n.trim();save();renderAll()}}
function del(){if(S.variants.length<2){alert("Mindestens eine Variante muss bleiben.");return}
  const v=cur();if(!confirm("Variante „"+v.name+"“ löschen?"))return;
  const i=S.variants.indexOf(v);S.variants.splice(i,1);S.active=S.variants[Math.max(0,i-1)].id;S.prev=S.variants[0].id;save();renderAll()}

/* ---------- Editor ---------- */
function renderSide(){
  const s=document.getElementById("side");s.innerHTML="";const v=cur();
  FIELDS.forEach(([grp,fs])=>{
    const h=document.createElement("h3");h.textContent=grp;s.appendChild(h);
    fs.forEach(([k,label,hint])=>{
      const r=document.createElement("div");r.className="row";
      r.innerHTML='<input type="color"><div class="lbl"><span></span><small></small></div><input type="text" maxlength="7" spellcheck="false">';
      r.querySelector(".lbl span").textContent=label;r.querySelector("small").textContent=hint;
      const col=r.children[0],txt=r.children[2];col.value=v.c[k];txt.value=v.c[k];
      col.oninput=()=>set(k,col.value,txt,col);
      txt.oninput=()=>{let t=txt.value.trim();if(t[0]!=="#")t="#"+t;if(hexOk(t))set(k,t.toLowerCase(),txt,col,true)};
      s.appendChild(r);
    });
  });
  const h=document.createElement("h3");h.textContent="Glow-Intensität";s.appendChild(h);
  const g=document.createElement("div");g.className="slider";
  g.innerHTML='<input type="range" min="0" max="100"><span></span>';
  const rg=g.children[0],lb=g.children[1];rg.value=v.c.glow;lb.textContent=v.c.glow;
  rg.oninput=()=>{v.c.glow=+rg.value;lb.textContent=rg.value;save();livePreview();renderBarSwatches()};
  s.appendChild(g);
  const h2=document.createElement("h3");h2.textContent="Kontrast (WCAG)";s.appendChild(h2);
  const c=document.createElement("div");c.className="contrast";c.id="contrast";s.appendChild(c);
  renderContrast();
}
function set(k,val,txt,col,fromTxt){
  const v=cur();v.c[k]=val;if(!fromTxt)txt.value=val;else col.value=val;
  save();livePreview();renderBarSwatches();renderContrast();
}
function renderBarSwatches(){
  const chips=document.querySelectorAll(".chip");const v=cur();const i=S.variants.indexOf(v);
  const sw=chips[i]&&chips[i].querySelectorAll(".sw i");if(!sw)return;
  ["bg","accent","accent2","text"].forEach((k,j)=>sw[j].style.background=v.c[k]);
}
function renderContrast(){
  const c=document.getElementById("contrast");if(!c)return;const v=cur().c;
  const pairs=[["Schrift / Hintergrund",v.text,v.bg],["Schrift / Panel",v.text,v.panel],["Gedämpft / Panel",v.muted,v.panel],
    ["Button Schrift / Button",v.btnText,v.btnBg],["Link / Hintergrund",v.link,v.bg],["Warnung / Panel",v.warn,v.panel],["Fehler / Panel",v.danger,v.panel]];
  c.innerHTML="";
  pairs.forEach(([n,a,b])=>{const r=ratio(a,b);const d=document.createElement("div");
    d.innerHTML='<span></span><span></span>';d.children[0].textContent=n;
    d.children[1].textContent=r.toFixed(1)+":1 "+(r>=4.5?"✓ AA":r>=3?"~ nur groß":"✗");
    d.children[1].className=r>=4.5?"ok":r>=3?"":"bad";c.appendChild(d)});
}

/* ---------- Teilen / Import / Export ---------- */
const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const dec=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");const s=atob(t);const b=Uint8Array.from(s,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(b))};
function clean(arr){return (Array.isArray(arr)?arr:[]).filter(v=>v&&v.c).map(v=>{const c={...BASE};KEYS.forEach(k=>{if(hexOk(v.c[k]))c[k]=v.c[k]});if(typeof v.c.glow==="number")c.glow=Math.max(0,Math.min(100,v.c.glow));
  return {id:Math.random().toString(36).slice(2,9),name:String(v.name||"Variante").slice(0,60),c}})}
let pending=null;
function offer(arr,src){pending=clean(arr);if(!pending.length)return;
  document.getElementById("bannerTxt").textContent=src+": "+pending.length+" Variante(n) gefunden.";
  document.getElementById("banner").classList.add("show")}
document.getElementById("bnAdd").onclick=()=>{if(pending){S.variants.push(...pending);S.prev=S.active;S.active=pending[0].id;save();renderAll()}closeBanner()};
document.getElementById("bnRep").onclick=()=>{if(pending){S.variants=pending;S.active=pending[0].id;S.prev=(pending[1]||pending[0]).id;save();renderAll()}closeBanner()};
document.getElementById("bnIgn").onclick=closeBanner;
function closeBanner(){pending=null;document.getElementById("banner").classList.remove("show");if(location.hash)history.replaceState(null,"",location.pathname+location.search)}
document.getElementById("bShare").onclick=async()=>{
  const url=location.origin+location.pathname+"#d="+enc(S.variants.map(({name,c})=>({name,c})));
  try{await navigator.clipboard.writeText(url);flash("Link kopiert (enthält alle Varianten)")}catch(e){prompt("Link kopieren:",url)}};
document.getElementById("bExport").onclick=()=>{
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S.variants.map(({name,c})=>({name,c})),null,2)],{type:"application/json"}));
  a.download="farbpaletten.json";a.click()};
document.getElementById("bImport").onclick=()=>document.getElementById("fImport").click();
document.getElementById("fImport").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{offer(JSON.parse(r.result),"Datei")}catch(x){alert("Ungültige JSON-Datei")}};r.readAsText(f);e.target.value=""};
function flash(t){const b=document.getElementById("bannerTxt");document.getElementById("banner").classList.add("show");
  ["bnAdd","bnRep","bnIgn"].forEach(i=>document.getElementById(i).style.display="none");b.textContent=t;
  setTimeout(()=>{document.getElementById("banner").classList.remove("show");["bnAdd","bnRep","bnIgn"].forEach(i=>document.getElementById(i).style.display="")},1800)}

/* ---------- Tastatur ---------- */
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.type!=="color"&&document.activeElement.type!=="range")return;
  if(e.key===" "){e.preventDefault();swap()}
  else if(/^[1-9]$/.test(e.key)){const v=S.variants[+e.key-1];if(v)activate(v.id)}
  else if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const i=S.variants.indexOf(cur());const n=S.variants[(i+(e.key==="ArrowRight"?1:-1)+S.variants.length)%S.variants.length];activate(n.id)}
});

function renderAll(){renderBar();renderSide();renderMain()}
load();renderAll();
if(location.hash.startsWith("#d=")){try{offer(dec(location.hash.slice(3)),"Geteilter Link")}catch(e){}}
</script>
</body>
</html>
