:root { --a: #c1f130; --ink: #10170a; --panel: #141d15; --line: #2a3a2b; --text: #dbe8c8; --muted: #8fa58a; --g1: #ff2a5f; --g2: #19e6ff; --arg: 193 241 48; --ff: "Bogen", "Rajdhani", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: transparent; }
body.w { overflow: hidden; }
body { font-family: "Bogen", "Rajdhani", system-ui, sans-serif; font-weight: 500; color: var(--text); }
svg.defs { position: absolute; width: 0; height: 0; }

/* ---------- Button (Größe = Schrift + 5 px Rand) ---------- */
.wrap { display: inline-flex; max-width: 100%; }
.wrap[data-fx~="glow"] { filter: drop-shadow(0 0 5px rgb(var(--arg) / .45)); }
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; cursor: pointer; max-width: 100%;
  font-family: var(--ff); padding: 5px 5px 5px calc(5px + .12em); line-height: 1.1; letter-spacing: .12em; user-select: none; -webkit-tap-highlight-color: transparent; overflow: hidden;
  background: var(--a); color: var(--ink); border: 0; --cut: clamp(5px, .32em, 9px); --pt: rgb(0 0 0 / .16);
  transition: background-color .12s, color .12s, transform .12s, translate .12s, scale .12s, filter .12s; }
.btn.caps .lbl { text-transform: uppercase; }
/* Füllung */
.btn.f-outline { background: var(--panel); color: var(--a); }
.btn.f-ghost { background: transparent; color: var(--a); }
/* Form */
.btn.sh-cut { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
.btn.sh-round { border-radius: .45em; }
.btn.sh-pill { border-radius: 999px; padding-left: calc(5px + .7em); padding-right: calc(5px + .6em); }
/* Rahmen */
.btn.fr-thin { box-shadow: inset 0 0 0 1px var(--fr); }
.btn.fr-thick { box-shadow: inset 0 0 0 2px var(--fr); }
.btn.fr-double { box-shadow: inset 0 0 0 1px var(--fr); }
.btn.fr-double::before, .btn.fr-dashed::before, .btn.fr-dotted::before { content: ""; position: absolute; pointer-events: none; z-index: 1; border: 1px solid var(--fr); }
.btn.fr-double::before { inset: 3px; }
.btn.fr-dashed::before, .btn.fr-dotted::before { inset: 2px; border-style: dashed; }
.btn.fr-dotted::before { border-style: dotted; }
.btn.sh-round.fr-double::before, .btn.sh-round.fr-dashed::before, .btn.sh-round.fr-dotted::before { border-radius: .3em; }
.btn.sh-pill.fr-double::before, .btn.sh-pill.fr-dashed::before, .btn.sh-pill.fr-dotted::before { border-radius: 999px; }
/* Rahmen der geschnittenen Form: SVG-Overlay statt CSS-Rahmen */
.btn.sh-cut, .btn.sh-cut:hover, .btn.sh-cut:focus-visible { box-shadow: none !important; }
.btn.sh-cut::before { display: none !important; }
.cf { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.cf polygon { fill: none; }
.cf .fr { stroke: var(--fr); }
.cf .hv { stroke: var(--a); opacity: 0; }

/* ---------- Generator ---------- */
body.gen { background: var(--pb); padding: 18px; height: auto; min-height: 100%; }
.gen main { max-width: 780px; margin: 0 auto; }
.gen h1 { margin: 0 0 4px; font-size: 1.45rem; letter-spacing: .1em; color: var(--pa); }
.gen .intro { margin: 0 0 18px; color: var(--pm); }
.card { background: var(--pp); border: 1px solid var(--pl); padding: 14px 16px 16px; margin-bottom: 14px;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.card h2 { margin: 0 0 10px; font-size: 1rem; letter-spacing: .12em; color: var(--pa); font-weight: 500; }
.row { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.row label, .row .lab { color: var(--pm); }
input[type=text], input[type=url] { width: 100%; font: inherit; font-size: 1rem; color: var(--ptx); background: rgb(0 0 0 / .25); border: 1px solid var(--pl); padding: 8px 10px; border-radius: 3px; }
input::placeholder { color: var(--pm); }
input:focus-visible, button:focus-visible { outline: 1px solid var(--pa); border-color: var(--pa); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg button, .copy, .dlg button { font: inherit; font-size: .95rem; cursor: pointer; color: var(--ptx); background: transparent; border: 1px solid var(--pl); padding: 6px 14px; border-radius: 3px; }
.seg button[aria-pressed=true] { border-color: var(--pa); color: var(--pa); }
.seg .sw { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--pl); background: var(--c); }
.seg .sw[aria-pressed=true] { border-color: #fff; transform: scale(1.12); }
.seg .diy { border-style: dashed; letter-spacing: .1em; }
.seg .diy.on { border-color: var(--pa); color: var(--pa); border-style: solid; }
.seg button.mchk[aria-pressed=true]::before { content: "✓ "; }
.seg .icobtn { min-width: 120px; display: inline-flex; gap: 8px; align-items: center; }
.seg .icobtn svg { width: 1.1em; height: 1.1em; }
.seg.fonts button { font-size: 1.05rem; padding: 6px 12px; }
.copy, .dlg button.go { background: var(--pa); color: var(--pink); border-color: var(--pa); }
.copy:disabled { opacity: .45; cursor: not-allowed; }
.hint2 { grid-column: 2; margin: -4px 0 0; color: var(--pm); font-size: .85rem; line-height: 1.35; }
.hint2.warn { color: #ffd23f; }
.prev { height: 70px; padding: 10px; background: repeating-linear-gradient(45deg, rgb(255 255 255 / .04) 0 10px, transparent 10px 20px); border: 1px dashed var(--pl); resize: both; overflow: hidden; min-height: 24px; min-width: 120px; }
.prevhint { margin: 6px 0 0; color: var(--pm); font-size: .85rem; }
.msg { margin: 6px 0 0; min-height: 1.2em; color: #ffd23f; font-size: .95rem; }
.out, .inl { display: flex; gap: 8px; } .out input, .inl input { flex: 1; }
.hl { margin: 8px 0 0; color: var(--pm); font-size: .95rem; line-height: 1.5; }
.hl b { color: var(--ptx); font-weight: 500; }
dialog.dlg { color: var(--ptx); background: var(--pp); border: 1px solid var(--pa); padding: 0; width: min(92vw, 480px); max-height: 88vh; overflow: auto;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
dialog.dlg::backdrop { background: rgb(0 0 0 / .6); }
.dlg-in { padding: 16px 18px 18px; }
.dlg h3 { margin: 0 0 12px; font-size: 1.05rem; letter-spacing: .12em; color: var(--pa); font-weight: 500; }
.dlg h4 { margin: 16px 0 8px; font-size: .95rem; letter-spacing: .1em; color: var(--pa); font-weight: 500; }
.crow { display: grid; grid-template-columns: 1fr 44px 96px 30px; gap: 8px; align-items: center; margin-bottom: 8px; }
.crow label { color: var(--ptx); }
.crow small { display: block; color: var(--pm); font-size: .78rem; }
.crow input[type=color] { width: 44px; height: 32px; padding: 0; border: 1px solid var(--pl); background: transparent; cursor: pointer; }
.crow input[type=text] { padding: 5px 8px; font-size: .9rem; }
.crow .x { padding: 2px 0; width: 30px; }
.combo { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 6px; }
.combo .dots { display: inline-flex; gap: 3px; }
.combo .dots i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--pl); display: inline-block; }
.dact { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tabs button { flex: 1; }
.tabs button[aria-selected=true] { border-color: var(--pa); color: var(--pa); }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; max-height: 46vh; overflow: auto; padding: 2px; }
.igrid button { padding: 0; height: 46px; font-size: 1.45rem; line-height: 1; display: grid; place-items: center; }
.igrid button svg { width: 24px; height: 24px; }
.igrid button[aria-pressed=true] { border-color: var(--pa); color: var(--pa); background: color-mix(in srgb, var(--pa) 14%, transparent); }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } .hint2 { grid-column: 1; } }

/* ---- Layout (Skizze) ---- */
.shell { max-width: 900px; margin: 0 auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--pp); border: 1px solid var(--pl); padding: 10px 14px; margin-bottom: 14px;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.topbar h1 { margin: 0; font-size: 1.3rem; letter-spacing: .1em; color: var(--pa); }
.themes { display: flex; gap: 8px; flex-wrap: wrap; }
.themes .tb { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: .92rem; cursor: pointer; color: var(--ptx); background: transparent; border: 1px solid var(--pl); padding: 5px 12px; border-radius: 3px; }
.themes .tb i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.themes .tb[aria-pressed=true] { border-color: var(--pa); color: var(--pa); }
.stage { display: grid; grid-template-columns: 170px 1fr; gap: 14px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { font: inherit; font-size: 1rem; text-align: left; cursor: pointer; color: var(--ptx); background: transparent; border: 0; border-left: 2px solid transparent; padding: 6px 10px; display: flex; justify-content: space-between; align-items: center; }
.nav button[aria-current=true] { border-left-color: var(--pa); color: var(--pa); background: color-mix(in srgb, var(--pa) 10%, transparent); }
.nav button:disabled { color: var(--pm); cursor: not-allowed; opacity: .7; }
.nav small { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--pl); padding: 0 5px; }
.prevcol { min-width: 0; }
.stage .prev { height: 120px; }
.sub3 { margin: 18px 0 10px; padding-top: 10px; border-top: 1px solid var(--pl); font-size: .9rem; letter-spacing: .14em; text-transform: uppercase; color: var(--pm); font-weight: 500; }
.sub3:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
.ghostbtn { font: inherit; font-size: .95rem; cursor: pointer; color: var(--ptx); background: transparent; border: 1px solid var(--pl); padding: 6px 14px; border-radius: 3px; }
@media (max-width: 640px) { .stage { grid-template-columns: 1fr; } .nav { flex-direction: row; flex-wrap: wrap; } }

/* ---- Zwei Spalten: Inhalt links, Vorschau rechts mitlaufend ---- */
.shell { max-width: 1240px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
.side { position: sticky; top: 12px; align-self: start; max-height: calc(100vh - 24px); overflow: auto; }
.side .card { margin-bottom: 10px; }
.side .prev { height: 120px; max-width: 100%; }
.navcard { padding: 8px 10px; }
.navcard .nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
.navcard .nav button { border-left: 0; border-bottom: 2px solid transparent; padding: 6px 12px; gap: 8px; }
.navcard .nav button[aria-current=true] { border-bottom-color: var(--pa); }
.card h2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.allbtns { display: flex; gap: 6px; }
.allbtns button { font: inherit; font-size: .8rem; letter-spacing: .06em; cursor: pointer; color: var(--pm); background: transparent; border: 1px solid var(--pl); padding: 2px 10px; border-radius: 3px; }
.allbtns button:hover { color: var(--pa); border-color: var(--pa); }
.sub3[role=button] { cursor: pointer; display: flex; align-items: center; gap: 8px; }
.sub3[role=button]::before { content: "▾"; color: var(--pa); }
.sub3[data-open=false]::before { content: "▸"; }
.grp.closed { display: none; }
.rowhead { font: inherit; font-size: 1rem; text-align: left; cursor: pointer; color: var(--ptx); background: transparent; border: 0; padding: 4px 0; display: inline-flex; align-items: center; gap: 8px; }
.rowhead:hover { color: var(--pa); }
.rowhead .chev { color: var(--pa); width: 1em; display: inline-block; }
.row .sum { display: none; color: var(--pm); font-size: .92rem; }
.row.closed .sum { display: block; }
.row.closed > :not(.rowhead):not(.sum) { display: none; }
.row.cr.closed { margin-bottom: 4px; }
@media (max-width: 920px) { .cols { grid-template-columns: 1fr; } .side { order: -1; top: 6px; z-index: 5; max-height: none; background: var(--pb); } }

/* ---- Rechte Spalte mittig zum Fenster ---- */
.side { top: 12px; height: calc(100vh - 24px); max-height: none; display: flex; flex-direction: column; overflow: auto; }
.sideinner { margin: auto 0; }
.themes .tb small { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--pl); padding: 0 4px; }
.themes .tb:disabled { color: var(--pm); cursor: not-allowed; opacity: .7; }
@media (max-width: 920px) { .side { height: auto; overflow: visible; } .sideinner { margin: 0; } }

/* ---- Vorschau-Rahmen = Inhalt + Randabstand ---- */
.side .prev { height: auto; width: fit-content; min-width: 60px; min-height: 40px; max-width: 100%; }
.navcard .nav { flex-wrap: wrap; }

/* ---- Adresse neu erzeugen ---- */
.out2 { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.out2 .msg { margin: 0; }
.alt { font: inherit; font-size: .9rem; cursor: pointer; color: var(--pa); background: transparent; border: 1px solid var(--pa); padding: 5px 12px; border-radius: 3px; }
.alt:hover { background: var(--pa); color: var(--pink); }

/* ---- Optionen mit Live-Vorschau ---- */
.seg.pvrow { gap: 8px; }
.pv { display: inline-flex; align-items: center; justify-content: center; padding: 8px 10px; border: 0; border-radius: 4px; cursor: pointer; background: transparent; outline: none; }
.pv:hover { background: rgb(var(--pa-rgb, 255 255 255) / .07); background: color-mix(in srgb, var(--pa) 8%, transparent); }
.pv:focus-visible { background: color-mix(in srgb, var(--pa) 14%, transparent); }
.pv[aria-pressed=true] { background: color-mix(in srgb, var(--pa) 16%, transparent); }
.pv .btn { cursor: pointer; }

/* ---- Farbauswahl: Kreise (Kuchenstücke) ---- */
.seg .pie { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 1px solid var(--pl); cursor: pointer; transform: rotate(-90deg); }
.seg .pie:hover { transform: rotate(-90deg) scale(1.08); }
.seg .pie[aria-pressed=true] { border-color: var(--pa); box-shadow: 0 0 0 2px var(--pp), 0 0 0 3px var(--pa); }

.stamp { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .08em; margin: 18px 0 10px; opacity: .7; }

/* Vorschau bei „Rahmen ausfüllen“: feste Rahmengröße (per Ecke ziehbar), damit die Schrift mitwachsen kann */
.prev.ff, .side .prev.ff, .stage .prev.ff { height: 120px; width: 100%; max-width: 100%; }

.igrid.fita button svg { width: 100%; height: 100%; overflow: visible; }
.igrid.fita button { overflow: hidden; }

</style>
</head>

  /* ---- Symbol-Popup: Reiter Emojis / Symbole ---- */
  const ip = $("ipick"); let tab = "e";

  function drawGrid() {

  /* Auswahl „Animiert“: jedes Symbol einzeln so skalieren, dass der äußerste Pixel an allen Seiten den Feldrahmen berührt (Ruhepose, ohne Bewegungs-Extras) */
  const FIT_OVR = { bienewelle: [0, 0, 24, 24], bieneschlange: [0, 0, 24, 24], bienezacken: [0, 0, 24, 24], bieneblume: [0, 0, 24, 24], barcode: [0, 3, 24, 20], biene: [0, 0, 24, 24], bienenblume: [7.5, -1, 18.5, 23.5] };

      if (!box) {
        const an = ANIMS.find((a) => a[0] === key), x = ANIM_X[key], parts = (ICONS[an[2]] || "").match(PART_RE) || [];
        let inner = x ? x.groups.map((gr) => "<g>" + gr.map((k) => parts[k] || "").join("") + "</g>").join("") : ICONS[an[2]];
        if (x && x.wrap) inner = "<g>" + inner + "</g>"; if (x && x.big) inner = '<g transform="' + x.big + '">' + inner + "</g>";
        const m = document.createElementNS("http://www.w3.org/2000/svg", "svg"); m.setAttribute("viewBox", "0 0 24 24"); m.setAttribute("fill", "none"); m.setAttribute("stroke", "currentColor"); m.setAttribute("stroke-width", "2");
        m.style.cssText = "position:absolute;left:-999px;top:0;width:24px;height:24px;visibility:hidden"; m.innerHTML = '<g id="fm">' + inner + "</g>"; document.body.appendChild(m);
        const bb = m.firstChild.getBBox(); document.body.removeChild(m);
        let sw = 2; (inner.match(/stroke-width="([\d.]+)"/g) || []).forEach(() => {}); const sws = (inner.match(/stroke-width="([\d.]+)"/g) || []).map((s) => parseFloat(s.replace(/[^\d.]/g, ""))); if (sws.length) sw = Math.max(sw, ...sws);
        const sc = x && x.big ? parseFloat((x.big.match(/scale\(([\d.]+)/) || [0, 1])[1]) : 1;
        box = { x: bb.x, y: bb.y, w: bb.width, h: bb.height, pad: sw / 2 * sc };
      }
      const s = Math.max(box.w, box.h) + 2 * box.pad, cx = box.x + box.w / 2, cy = box.y + box.h / 2;
      FIT_CACHE[key] = [cx - s / 2, cy - s / 2, s, s].map((v) => Math.round(v * 100) / 100).join(" ");

    svg.setAttribute("viewBox", FIT_CACHE[key]);
  }
  $("g-ico").addEventListener("click", () => { drawGrid(); if (ip.showModal) ip.showModal(); else ip.setAttribute("open", ""); });
  $("tab-e").addEventListener("click", () => { tab = "e"; drawGrid(); }); $("tab-s").addEventListener("click", () => { tab = "s"; drawGrid(); }); $("tab-a").addEventListener("click", () => { tab = "a"; drawGrid(); });
  $("ip-none").addEventListener("click", () => { S.icon = ""; drawIcoBtn(); render(); ip.close(); }); $("ip-ok").addEventListener("click", () => ip.close());
  ip.addEventListener("click", (e) => { if (e.target === ip) ip.close(); });

  /* ---- Vorschau, Adresse ---- */
  const prev = $("g-prev"); let btn = null;

  }
  function render() {

    const cfg = cfgNow();
    prev.style.display = "flex"; prev.style.alignItems = "center"; prev.style.justifyContent = JUST[S.align];
    prev.classList.toggle("ff", S.fit === "frame");
    btn = buildButton(cfg, prev); btn.addEventListener("click", (e) => { if (!okUrl(cfg.url)) e.preventDefault(); });

    $("g-msg").textContent = ok ? "" : !raw ? "Ziel fehlt: Der Button ist deaktiviert, bis eine gültige Ziel-Adresse eingetragen ist." : "Ziel nicht erlaubt oder unvollständig: Der Button ist deaktiviert (erlaubt: https:// mit Notion bzw. Formular-Adresse, oder eine E-Mail-Adresse).";
    const hint = $("g-openhint");
    if (ok && href.startsWith("mailto:")) { hint.textContent = "Bei E-Mail ohne Wirkung: öffnet das Mailprogramm. In Notion ungetestet."; hint.className = "hint2 warn"; }
    else if (S.open === "tab") { hint.textContent = OPENHINT.tab; hint.className = "hint2"; }
    else if (ok && !peekPossible(href)) { hint.textContent = "Nur mit Link auf einen Datenbank-Eintrag (Adresse enthält p=…). Sonst öffnet ein normaler Tab."; hint.className = "hint2 warn"; }
    else { hint.textContent = OPENHINT[S.open] + " Ungetestet: Notion kann die Ansicht ignorieren."; hint.className = "hint2"; }
    { const pd = parseFloat(getComputedStyle(prev).paddingLeft) || 0, w = Math.ceil(btn.getBoundingClientRect().width + 2 * pd), h = Math.ceil(btn.getBoundingClientRect().height + 2 * pd);
      $("g-fitnote").textContent = S.fit === "frame" ? "Der Button füllt den Rahmen bis auf den Randabstand (" + pd + " px); Schrift und Symbol passen sich der Rahmengröße an. Rahmen in Notion beliebig ziehen. Vorschau: Kasten an der Ecke ziehen." : "Rahmen in Notion mindestens ca. " + w + " × " + h + " px, dann schließt er mit dem Button ab."; }
    updateSums();
    $("g-schemehint").textContent = SCHEMEHINT[S.scheme]; $("g-schemehint").className = "hint2" + (S.scheme === "auto" ? " warn" : "");
    const p = new URLSearchParams(); p.set("w", "button"); p.set("url", ok && isMail(cfg.url) ? href : cfg.url);
    if (cfg.label) p.set("label", cfg.label); if (cfg.sub) p.set("sub", cfg.sub); if (cfg.icon) p.set("icon", cfg.icon);
    if (cfg.theme !== "standard") p.set("theme", cfg.theme);
    if (S.fill !== "solid") p.set("fill", S.fill); if (S.shape !== "cut") p.set("shape", S.shape); if (S.frame !== "auto") p.set("frame", S.frame); if (S.pat !== "scan") p.set("pat", S.pat);
    if (S.hov !== "bright") p.set("hov", S.hov); if (S.clk !== "press") p.set("clk", S.clk); if (S.scheme !== "auto") p.set("scheme", S.scheme); if (S.pad !== "auto") p.set("pad", S.pad); if (S.fit === "frame") p.set("fit", "frame");
    if (!cfg.caps) p.set("caps", "0"); if (cfg.size !== "mid") p.set("size", cfg.size); if (S.align !== "left") p.set("align", S.align); if (cfg.font !== "rajdhani") p.set("font", cfg.font);
    if (cfg.fx.slice().sort().join() !== FX_DEFAULT.slice().sort().join()) p.set("fx", cfg.fx.length ? cfg.fx.join(",") : "none");
    if (cfg.open !== "tab") p.set("open", cfg.open);
    DIY_KEYS.forEach(([k]) => { if (S.diy[k]) p.set(k, S.diy[k]); });
    $("g-out").value = location.origin + location.pathname + "?" + p.toString();
    $("g-copy").disabled = false;
  }
  ["g-label", "g-sub", "g-url"].forEach((id) => $(id).addEventListener("input", render));
  $("g-copy").addEventListener("click", async () => {
    const o = $("g-out"); o.select();
    try { await navigator.clipboard.writeText(o.value); $("g-copy").textContent = "Kopiert"; } catch (e) { document.execCommand && document.execCommand("copy"); $("g-copy").textContent = "Markiert – Strg+C"; }
    setTimeout(() => { $("g-copy").textContent = "Kopieren"; }, 1800);
  });
  $("g-regen").addEventListener("click", () => {
    render();
    const m = $("g-regenmsg");
    m.textContent = "Neu erzeugt aus den aktuellen Einstellungen.";
    clearTimeout(m._t); m._t = setTimeout(() => { m.textContent = ""; }, 2400);
  });
  /* ---- Vorhandenes Widget laden ---- */
  $("g-loadgo").addEventListener("click", () => {
    const m = $("g-loadmsg"); let u;
    try { u = new URL($("g-load").value.trim()); } catch (e) { m.textContent = "Keine gültige Adresse."; return; }
    if (!u.searchParams.has("url") && !u.searchParams.has("w")) { m.textContent = "Adresse enthält keine Widget-Werte (Teil „?url=…“ fehlt)."; return; }
    const wt = (u.searchParams.get("w") || "button").toLowerCase();
    if (wt !== "button") { m.textContent = "Widget-Typ „" + wt + "“ ist noch nicht verfügbar."; return; }
    const c = cfgFromParams(u.searchParams);
    $("g-label").value = c.label; $("g-sub").value = c.sub; $("g-url").value = c.url;
    S.theme = THEMES[c.theme] ? c.theme : "standard"; S.fill = pick(FILLS, c.fill, "solid"); S.shape = pick(SHAPES, c.shape, "cut"); S.frame = pick(FRAMES, c.frame, "auto"); S.pat = pick(PATTERNS, c.pat, "scan");
    S.hov = pick(HOVERS, c.hov, "bright"); S.clk = pick(CLICKS, c.clk, "press"); S.scheme = pick(SCHEMES, c.scheme, "auto"); S.caps = c.caps; S.fx = c.fx;
    S.open = pick(OPEN, c.open, "tab"); S.size = pick(SIZES, c.size, "mid"); S.align = JUST[c.align] ? c.align : "left"; S.font = pick(FONTS, c.font, "rajdhani"); S.icon = c.icon; S.diy = {}; S.pad = c.pad; S.fit = c.fit;
    DIY_KEYS.forEach(([k]) => { if (HEX.test(c[k] || "")) S.diy[k] = c[k].toLowerCase(); });
    applyPage(); drawAll(); render(); m.textContent = "Geladen. Nach dem Anpassen neue Adresse in der Notion-Einbettung ersetzen.";
  });
  /* ---- Einklappbare Zeilen und Gruppen ---- */
  const OK = "wfn-open";
  let openState = {}; try { openState = JSON.parse(localStorage.getItem(OK) || "{}") || {}; } catch (e) { openState = {}; }
  const saveOpen = () => { try { localStorage.setItem(OK, JSON.stringify(openState)); } catch (e) { /* ignorieren */ } };
  const lbl = (list, v) => { const x = list.find((i) => i[0] === v); return x ? x[1] : String(v); };
  const SUMS = {
    "g-open": () => lbl(OPEN, S.open), "g-colors": () => activeName(),
    "g-fill": () => lbl(FILLS, S.fill), "g-shape": () => lbl(SHAPES, S.shape), "g-frame": () => lbl(FRAMES, S.frame), "g-pat": () => lbl(PATTERNS, S.pat),
    "g-font": () => lbl(FONTS, S.font), "g-size": () => { const z = SIZES.find((x) => x[0] === S.size) || SIZES[1]; return z[1] + " · " + z[2] + " px"; },
    "g-caps": () => (S.caps ? "Großbuchstaben" : "Normal"), "g-align": () => lbl(ALIGNS, S.align), "g-fit": () => (S.fit === "frame" ? "Rahmen ausfüllen" : "Nach Inhalt"),
    "g-pad": () => (S.pad === "auto" ? "Auto" : S.pad + " px"), "g-fx": () => (S.fx.length ? S.fx.map((k) => lbl(FX, k)).join(", ") : "Keiner"),
    "g-hov": () => lbl(HOVERS, S.hov), "g-clk": () => lbl(CLICKS, S.clk), "g-scheme": () => lbl(SCHEMES, S.scheme),
  };
  function updateSums() { Object.keys(SUMS).forEach((id) => { const e = $(id + "-sum"); if (e) e.textContent = SUMS[id](); }); }
  const rowSetters = [];
  function setupCollapse() {
    Object.keys(SUMS).forEach((id) => {
      const row = $(id).closest(".row"), lab = row.querySelector(".lab"); if (!lab) return;
      const head = document.createElement("button"); head.type = "button"; head.className = "rowhead";
      const chev = document.createElement("span"); chev.className = "chev"; head.append(chev, document.createTextNode(lab.textContent));
      const sum = document.createElement("span"); sum.className = "sum"; sum.id = id + "-sum";
      lab.replaceWith(head); head.after(sum); row.classList.add("cr");
      const set = (open) => { row.classList.toggle("closed", !open); head.setAttribute("aria-expanded", String(open)); chev.textContent = open ? "▾" : "▸"; };
      set(!!openState[id]); rowSetters.push([id, set]);

    });
    document.querySelectorAll(".sub3").forEach((h) => {
      const name = h.textContent, grp = document.createElement("div"); grp.className = "grp";
      let n = h.nextElementSibling; while (n && !n.classList.contains("sub3")) { const nx = n.nextElementSibling; grp.appendChild(n); n = nx; }
      h.after(grp); h.setAttribute("role", "button"); h.tabIndex = 0;
      const set = (open) => { grp.classList.toggle("closed", !open); h.dataset.open = String(open); h.setAttribute("aria-expanded", String(open)); };
      set(openState["g:" + name] !== false);

      h.addEventListener("click", tog); h.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tog(); } });
    });
  }
  setupCollapse(); applyPage(); drawAll(); render();
  { const st = document.createElement("p"); st.className = "stamp"; st.textContent = "Stand: 22.11.2026 21:17"; $("app").appendChild(st); }
  startBursts(() => btn);
}
